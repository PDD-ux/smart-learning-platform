<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 / 注册 · 昇思学练 MindSpark</title>
<link rel="stylesheet" href="prototype.css">
<style>
  .auth-page { min-height: 100vh; display: grid; grid-template-columns: 1.1fr 0.9fr; }
  .auth-left {
    position: relative;
    padding: 64px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .auth-left::before {
    content: '';
    position: absolute;
    top: -20%;
    left: -20%;
    width: 80%;
    height: 80%;
    background: radial-gradient(circle, rgba(147, 129, 255, 0.20), transparent 60%);
    pointer-events: none;
  }
  .auth-left::after {
    content: '';
    position: absolute;
    bottom: -10%;
    right: -10%;
    width: 60%;
    height: 60%;
    background: radial-gradient(circle, rgba(19, 221, 196, 0.12), transparent 55%);
    pointer-events: none;
  }
  .auth-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 48px; position: relative; z-index: 1; }
  .auth-brand .logo {
    width: 44px; height: 44px; border-radius: 12px;
    background: var(--grad-primary); display: grid; place-items: center;
    font-weight: 700; font-size: 20px; color: #fff;
  }
  .auth-brand .name { font-size: 20px; font-weight: 700; }
  .eyebrow {
    font-size: 12px; color: var(--primary); letter-spacing: 2px; text-transform: uppercase;
    margin-bottom: 16px; position: relative; z-index: 1;
  }
  .auth-left h1 {
    font-size: 42px; font-weight: 700; line-height: 1.25;
    margin-bottom: 16px; position: relative; z-index: 1;
  }
  .auth-left .subtitle { color: var(--text-secondary); font-size: 16px; margin-bottom: 40px; position: relative; z-index: 1; }
  .feature-list { display: flex; flex-direction: column; gap: 20px; position: relative; z-index: 1; }
  .feature-item { display: flex; align-items: flex-start; gap: 14px; }
  .feature-item .check {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent-text);
    display: grid; place-items: center; font-size: 13px; flex-shrink: 0;
  }
  .feature-item h4 { font-size: 15px; margin-bottom: 4px; }
  .feature-item p { color: var(--text-muted); font-size: 13px; }
  .metrics { display: flex; gap: 48px; margin-top: 56px; position: relative; z-index: 1; }
  .metric .num { font-size: 28px; font-weight: 700; }
  .metric .label { color: var(--text-muted); font-size: 12px; margin-top: 4px; }
  .auth-right {
    display: grid; place-items: center;
    padding: 48px;
    position: relative;
  }
  .auth-right::before {
    content: '';
    position: absolute;
    top: 10%; right: -20%;
    width: 70%; height: 70%;
    background: radial-gradient(circle, rgba(46, 167, 255, 0.15), transparent 55%);
    pointer-events: none;
  }
  .auth-card {
    width: 100%; max-width: 420px;
    padding: 40px;
    position: relative; z-index: 1;
  }
  .auth-tabs { display: flex; gap: 8px; margin-bottom: 28px; }
  .auth-tab {
    flex: 1; padding: 10px; text-align: center;
    border-radius: var(--radius-pill); cursor: pointer;
    color: var(--text-muted); font-weight: 600;
    transition: all .2s ease;
  }
  .auth-tab.active { background: var(--surface-active); color: var(--text); }
  .password-strength {
    display: flex; align-items: center; gap: 8px;
    margin-top: 8px; font-size: 12px; color: var(--accent-text);
  }
  .strength-bar { flex: 1; height: 4px; border-radius: var(--radius-pill); background: rgba(255,255,255,0.08); }
  .strength-bar > span { display: block; height: 100%; width: 80%; border-radius: var(--radius-pill); background: var(--grad-button); }
  .code-row { display: flex; gap: 12px; }
  .code-row .input { flex: 1; }
  .divider { display: flex; align-items: center; gap: 16px; margin: 24px 0; color: var(--text-muted); font-size: 13px; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .social-btns { display: flex; gap: 12px; }
  .social-btns .btn { flex: 1; }
</style>
</head>
<body>
  <div class="aurora-bg"></div>
  <div class="auth-page">
    <div class="auth-left">
      <div class="auth-brand">
        <div class="logo">M</div>
        <div>
          <div class="name">昇思学练</div>
          <div style="font-size:11px;color:var(--text-muted);letter-spacing:2px;">MINDSPARK</div>
        </div>
      </div>
      <div class="eyebrow">MINDSPORE × LLM · 端云协同</div>
      <h1>把任意学习资料，<br>一键转成可复习的知识卡片</h1>
      <p class="subtitle">视频 / 图文 / 拍照笔记 → 知识卡片 · 练习题 · 薄弱点地图</p>
      <div class="feature-list">
        <div class="feature-item">
          <div class="check">✓</div>
          <div>
            <h4>端侧图像理解</h4>
            <p>MindSpore 照片分类 + 文字区域检测，秒级完成</p>
          </div>
        </div>
        <div class="feature-item">
          <div class="check">✓</div>
          <div>
            <h4>大模型深度抽取</h4>
            <p>自动抽取知识点，生成闪卡与知识图谱</p>
          </div>
        </div>
        <div class="feature-item">
          <div class="check">✓</div>
          <div>
            <h4>SM-2 遗忘曲线闭环</h4>
            <p>复习排期 + 掌握度画像 + 薄弱点看板联动</p>
          </div>
        </div>
      </div>
      <div class="metrics">
        <div class="metric"><div class="num">3 步</div><div class="label">导入 → 解析 → 复习</div></div>
        <div class="metric"><div class="num">92%</div><div class="label">图像分类准确率</div></div>
        <div class="metric"><div class="num">SM-2</div><div class="label">遗忘曲线排期</div></div>
      </div>
    </div>
    <div class="auth-right">
      <div class="card auth-card">
        <div class="auth-tabs">
          <div class="auth-tab active">登录</div>
          <div class="auth-tab">注册</div>
        </div>
        <div class="input-group">
          <label>邮箱 / 手机号</label>
          <input class="input" placeholder="you@example.com">
        </div>
        <div class="input-group">
          <label>密码</label>
          <input class="input" type="password" value="************">
          <div class="password-strength">
            <span>强度：强</span>
            <div class="strength-bar"><span></span></div>
            <span>已包含大小写与数字</span>
          </div>
        </div>
        <div class="input-group">
          <label>验证码</label>
          <div class="code-row">
            <input class="input" placeholder="6 位数字">
            <button class="btn">获取验证码</button>
          </div>
        </div>
        <button class="btn primary block lg" style="margin-top:8px;">登录并开始学习</button>
        <div class="divider">或使用第三方账号登录</div>
        <div class="social-btns">
          <button class="btn">微信</button>
          <button class="btn">学校统一身份</button>
        </div>
        <p style="text-align:center;margin-top:20px;color:var(--text-muted);font-size:13px;">
          还没有账号？<a href="#">立即注册</a>
        </p>
      </div>
    </div>
  </div>
</body>
</html>
