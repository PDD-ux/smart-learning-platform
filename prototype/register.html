<title>注册 · 文豪智能学习平台</title>
<link rel="stylesheet" href="prototype.css" data-page-node-id="Bun4Q3lMHPFcjg9dod5Kjo">
<style>
  .auth-wrap {
    min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: var(--grad-hero); position: relative; overflow: hidden;
  }
  .auth-wrap::before {
    content: ""; position: absolute; left: -80px; top: -80px;
    width: 340px; height: 340px; border-radius: 50%;
    background: radial-gradient(circle, rgba(124,92,240,.5), transparent 70%);
  }
  .auth-wrap::after {
    content: ""; position: absolute; right: -100px; bottom: -100px;
    width: 400px; height: 400px; border-radius: 50%;
    background: radial-gradient(circle, rgba(0,194,168,.35), transparent 70%);
  }
  .auth-card { width: 100%; max-width: 440px; position: relative; z-index: 1; }
  .auth-brand { text-align: center; margin-bottom: 26px; color: #fff; }
  .auth-brand .logo {
    width: 60px; height: 60px; border-radius: 18px; margin: 0 auto 14px;
    background: var(--grad-primary); color: #fff; display: grid; place-items: center;
    font-size: 30px; font-weight: 700; box-shadow: 0 8px 24px rgba(124,92,240,.5);
  }
  .auth-brand h1 { font-size: 22px; font-weight: 700; }
  .auth-brand p { color: #c7c7e0; font-size: 13px; margin-top: 4px; }
  .glass {
    background: rgba(255,255,255,.96); backdrop-filter: blur(20px);
    border-radius: 20px; box-shadow: var(--shadow-lg); padding: 30px;
  }
  .auth-foot { text-align: center; margin-top: 18px; font-size: 13px; color: var(--text-muted); }
  .code-row { display: flex; gap: 10px; }
  .code-row .btn { flex-shrink: 0; }
  .strength { height: 6px; border-radius: 999px; background: #eceaf7; margin-top: 8px; overflow: hidden; }
  .strength > span { display: block; height: 100%; width: 60%; background: var(--warning); border-radius: 999px; }
  .strength-hint { font-size: 12px; color: var(--warning); margin-top: 4px; }
</style>
</head>
